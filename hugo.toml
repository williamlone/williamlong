baseURL = 'https://www.williamlong.info/'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
title = '月光博客'
hasCJKLanguage = true
enableRobotsTXT = true
uglyURLs = true
disablePathToLower = true

[taxonomies]
  category = 'categories'
  tag = 'tags'
  weibo_category = 'weibo_categories'
  weibo_tag = 'weibo_tags'
  google_category = 'google_categories'
  google_tag = 'google_tags'
  info_category = 'info_categories'
  apps_tag = 'apps_tags'
  book_category = 'book_categories'
  movie_category = 'movie_categories'
  story_category = 'story_categories'
  anni_category = 'anni_categories'

[permalinks.term]
  categories = '/cat/:slug'
  tags = '/tag/:slug'
  weibo_categories = '/weibo/cat/:slug'
  weibo_tags = '/weibo/tag/:slug'
  google_categories = '/google/cat/:slug'
  google_tags = '/google/tag/:slug'
  info_categories = '/info/cat/:slug'
  apps_tags = '/apps/tag/:slug'
  book_categories = '/book/cat/:slug'
  movie_categories = '/movie/cat/:slug'
  story_categories = '/story/cat/:slug'
  anni_categories = '/anni/cat/:slug'

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
    files = ['! */categories', '! */tags']
  [[module.mounts]]
    source = 'content/anni/categories'
    target = 'content/anni_categories'
  [[module.mounts]]
    source = 'content/apps/tags'
    target = 'content/apps_tags'
  [[module.mounts]]
    source = 'content/book/categories'
    target = 'content/book_categories'
  [[module.mounts]]
    source = 'content/google/categories'
    target = 'content/google_categories'
  [[module.mounts]]
    source = 'content/google/tags'
    target = 'content/google_tags'
  [[module.mounts]]
    source = 'content/info/categories'
    target = 'content/info_categories'
  [[module.mounts]]
    source = 'content/movie/categories'
    target = 'content/movie_categories'
  [[module.mounts]]
    source = 'content/story/categories'
    target = 'content/story_categories'
  [[module.mounts]]
    source = 'content/weibo/categories'
    target = 'content/weibo_categories'
  [[module.mounts]]
    source = 'content/weibo/tags'
    target = 'content/weibo_tags'

[pagination]
  pagerSize = 50
  path = 'page'

[params]
  mainSections = ["archives"]
  author = '月光'
  description = '月光博客，是专注于业界、互联网、搜索引擎优化、社会化网络、IT技术、谷歌地图、建站、软件等领域的原创IT科技博客，作者龙威廉。'
  keywords = '月光,博客,月光博客,科技博客,IT博客,谷歌地图,谷歌地球'
  adsense = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = []
  term = ["HTML"]

[outputFormats.RSS]
  baseName = 'rss'
