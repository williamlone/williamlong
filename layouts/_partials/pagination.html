{{- $p := .Paginator -}}
{{- if gt $p.TotalPages 1 -}}
<div class="pagination clearfix">
	{{- if $p.HasPrev -}}
	<a class='page-numbers' href="{{ (index $p.Pagers 0).URL }}"><span class="page first-page">&laquo;</span></a>
	{{- end -}}
	{{- range $p.Pagers -}}
	{{- if eq .PageNumber $p.PageNumber -}}
	<span class='page-numbers current'>{{ .PageNumber }}</span>
	{{- else -}}
	<a class='page-numbers' href="{{ .URL }}">{{ .PageNumber }}</a>
	{{- end -}}
	{{- end -}}
	{{- if $p.HasNext -}}
	<a class='page-numbers' href="{{ (index $p.Pagers (sub $p.TotalPages 1)).URL }}"><span class="page last-page">&raquo;</span></a>
	{{- end -}}
</div>
{{- end -}}
