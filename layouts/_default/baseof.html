<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="applicable-device" content="pc,mobile">
	<link rel="apple-touch-icon-precomposed" href="/images/apple-touch-icon.png" />
	<link rel="stylesheet" type="text/css" media="all" href="/theme/style.css"/>
	<link rel="canonical" href="{{ .Permalink }}"/>
	<link rel="alternate" type="application/rss+xml" href="/rss.xml" title="月光博客" />
	{{ if .IsHome }}
	<title>月光博客-关注互联网和搜索引擎的IT科技博客</title>
	{{ else }}
	<title>{{ .Title }}-月光博客</title>
	{{ end }}
	<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}" />
	<meta name="keywords" content="{{ with .Keywords }}{{ delimit . "," }}{{ else }}{{ site.Params.keywords }}{{ end }}" />
</head>
<body class="{{ if eq .Kind "page" }}single single-post postid-{{ .File.ContentBaseName }} single-format-standard{{ else }}home blog{{ end }}">
<div id="wrap" class="container clearfix">
	{{ partial "header.html" . }}

	<div id="main" class="container">
		<div class="content alpha">
			{{ block "main" . }}{{ end }}
		</div>

		{{ partial "sidebar.html" . }}
	</div><!-- END container -->
</div><!-- END wrap -->
{{ partial "footer.html" . }}
</body>
</html>
